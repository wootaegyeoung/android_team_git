plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.gachon.mp_termproject'
    compileSdk 33

    defaultConfig {
        applicationId "com.gachon.mp_termproject"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"

        // ⬇️ GitHub Actions에서 -P로 넘겨주는 값 우선 사용
        def verName = project.findProperty("versionName") ?: "dev"
        def verCode = (project.findProperty("versionCode") ?: "1").toInteger()
        versionName verName
        versionCode verCode

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // ⬇️ CI 환경변수 기반 릴리즈 서명
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: "my-release.keystore"
            storeFile file(ksPath)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            // 필요 시 난독화/리소스 축소 켜세요
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 릴리즈 서명 연결
            signingConfig signingConfigs.release
        }
        debug {
            // 디버그에서도 버전 주입 값 확인하고 싶으면 주석 해제
            // applicationIdSuffix ".debug"
            // versionNameSuffix "-debug"
        }
    }
    // ⬇️ Android 15/AGP 권장 JDK 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // (권장) 라이브러리 일부는 최신화 검토
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ⬇️ 중복 material 제거 (하나만 남기세요)
    implementation 'com.google.android.material:material:1.9.0'
    // implementation 'com.google.android.material:material:1.0.0-rc01' // 삭제

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation platform('com.google.firebase:firebase-bom:32.0.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-firestore:24.6.0'
    implementation 'com.google.firebase:firebase-storage:20.0.0'
    implementation 'com.borax12.materialdaterangepicker:library:2.0'

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    implementation 'org.parceler:parceler-api:1.1.12'
    annotationProcessor 'org.parceler:parceler:1.1.12'
}